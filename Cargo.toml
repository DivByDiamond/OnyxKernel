[workspace]
resolver = "2"
members = ["kernel", "core", "init", "tools"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["loki5512344"]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
# Audit blocker: arithmetic bugs in kernel paths (page align, size math)
# must panic in release builds too instead of silently wrapping.
overflow-checks = true
# Audit note: lto = "fat" AND lto = "thin" both break the kernel link
# (undefined __rust_alloc / slice_index_fail / raw_vec::handle_error pulled
# from onyx_core objects when std bitcode is LTO-merged; verified after a
# clean rebuild of target/<target>/release/deps). Kept at false until the
# global_allocator / panic-handler shims survive cross-crate LTO.
lto = false
codegen-units = 1
opt-level = "z"
debug = true
strip = "debuginfo"
