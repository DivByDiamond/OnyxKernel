[workspace]
resolver = "2"
members = ["kernel", "core", "init", "tools"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
authors = ["loki5512344"]

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
# Audit blocker: arithmetic bugs in kernel paths (page align, size math)
# must panic in release builds too instead of silently wrapping.
overflow-checks = true
# Audit note: lto = "fat" AND lto = "thin" both break the kernel link
# (undefined __rust_alloc / slice_index_fail / raw_vec::handle_error pulled
# from onyx_core objects when std bitcode is LTO-merged; verified after a
# clean rebuild of target/<target>/release/deps). Kept at false until the
# global_allocator / panic-handler shims survive cross-crate LTO.
lto = false
codegen-units = 1
opt-level = "z"
debug = true
strip = "debuginfo"

# onyx_core stays at -O3 while the rest of the workspace is size-optimised:
# it carries the CPU-bound userspace paths (crypto KDF/login, parsers).
# Measured 2026-11-10 (Xeon E5-2680 v3, everything else at -Oz): login KDF
# -19%, `$5$` 5000 rounds -22%, sha256 <=65 B -10..-17%, bulk hashing
# unchanged. Cost: +3.3..4.6 KB .text per crypto-linking init binary
# (login/passwd/su/useradd, +16.4 KB total); the kernel shrinks by 2 KB.
# Details: docs/history/2026-11-sha256-throughput.md.
[profile.release.package.onyx_core]
opt-level = 3

[patch.crates-io]
miniz_oxide = { path = "vendor/miniz_oxide" }
