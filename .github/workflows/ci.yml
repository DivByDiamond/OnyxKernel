name: OnyxKernel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: |
          python3 scripts/generate-syscalls.py --check
          python3 scripts/test-generate-syscalls.py
          cargo fmt --all -- --check
          python3 scripts/quality/no-dead-allow.py

  clippy-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: riscv64gc-unknown-none-elf, riscv32imac-unknown-none-elf
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Full strict clippy matrix
        run: bash scripts/quality/check.sh

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Strict clippy including tests
        run: cargo clippy -p onyx_core --all-targets -- -D warnings

      - name: Test core
        run: cargo test -p onyx_core

  test-kernel-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test kernel (host tests)
        run: cargo test -p onyx_kernel

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [riscv64gc-unknown-none-elf, riscv32imac-unknown-none-elf]
        include:
          - target: riscv64gc-unknown-none-elf
            alias: kbuild
          - target: riscv32imac-unknown-none-elf
            alias: kbuild32
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build kernel (${{ matrix.target }})
        run: cargo ${{ matrix.alias }}

      # smode feature variant of the 64-bit build only.
      - name: Build kernel (riscv64, smode)
        if: matrix.target == 'riscv64gc-unknown-none-elf'
        run: cargo kbuild --features smode

      - name: Build tools
        run: cargo tbuild

      - name: Upload kernel ELF
        uses: actions/upload-artifact@v6
        with:
          name: onyxkernel-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/onyx-kernel
