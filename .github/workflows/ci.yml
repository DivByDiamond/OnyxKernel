name: OnyxKernel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: |
          python3 scripts/generate-syscalls.py --check
          python3 scripts/test-generate-syscalls.py
          cargo fmt --check -p onyx_core -p onyx_init -p onyx_tools
          rustfmt --check --edition 2024 \
            kernel/src/drivers/video/fb/devices.rs \
            kernel/src/libfdt/fdt/framebuffer.rs \
            kernel/src/libfdt/fdt/walk.rs

  clippy-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: riscv64gc-unknown-none-elf, riscv32imac-unknown-none-elf
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The package library is a std-based host-test harness, so lint it
      # separately from the freestanding RISC-V kernel binary.
      - name: clippy onyx_kernel lib (host, strict)
        run: cargo clippy -p onyx_kernel --lib -- -D warnings

      - name: clippy onyx_kernel target riscv64 (strict)
        run: cargo clippy -p onyx_kernel --release --target riscv64gc-unknown-none-elf --bin onyx-kernel -- -D warnings

  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Strict clippy on the library itself (-A non-snake-case: SIG0/SIG1
      # in core/src/crypto/sha256.rs follow standard SHA-256 paper naming).
      # Note: core/src/lib.rs has #![warn(clippy::all)], and source
      # attributes take precedence over command-line -A flags, so
      # pre-existing style lints in the embedded tests can't be allowed
      # from here — they're tracked by the advisory step below.
      - name: clippy onyx_core lib (strict)
        run: cargo clippy -p onyx_core -- -D warnings -A non-snake-case

      # Advisory until the cfg(test) code in core passes clippy
      # (b"..\0" c-string literals, vec! in tests, const asserts).
      - name: clippy onyx_core tests (advisory)
        run: cargo clippy -p onyx_core --all-targets -- -D warnings -A non-snake-case
        continue-on-error: true

      - name: Test core
        run: cargo test -p onyx_core

  test-kernel-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test kernel (host tests)
        run: cargo test -p onyx_kernel

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [riscv64gc-unknown-none-elf, riscv32imac-unknown-none-elf]
        include:
          - target: riscv64gc-unknown-none-elf
            alias: kbuild
          - target: riscv32imac-unknown-none-elf
            alias: kbuild32
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build kernel (${{ matrix.target }})
        run: cargo ${{ matrix.alias }}

      # smode feature variant of the 64-bit build only.
      - name: Build kernel (riscv64, smode)
        if: matrix.target == 'riscv64gc-unknown-none-elf'
        run: cargo kbuild --features smode

      - name: Build tools
        run: cargo tbuild

      - name: Upload kernel ELF
        uses: actions/upload-artifact@v6
        with:
          name: onyxkernel-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/onyx-kernel
